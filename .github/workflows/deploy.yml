# Production image build and Dokploy redeployment.
#
# The VPS has four shared vCPUs, so CI builds the image and the server only
# pulls the completed artifact.
name: Deploy

on:
  push:
    branches: [main]
    # Documentation-only commits do not need an image rebuild or redeployment.
    paths-ignore:
      - "**.md"
  # Allows rebuilding without a commit, for example after a build argument change.
  workflow_dispatch:

concurrency:
  # Concurrent deployments could make Dokploy pull a partially pushed `latest`.
  # Queue them instead of cancelling an in-progress deployment.
  group: deploy-main
  cancel-in-progress: false

env:
  # GHCR requires lowercase names even when the repository owner is MValles02.
  IMAGE: ghcr.io/mvalles02/parfam-mdq

jobs:
  image:
    name: Build and publish to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # GHCR rejects a GITHUB_TOKEN push for a new personal-namespace package
      # despite Packages: write permissions. Use the classic write:packages PAT
      # that Dokploy also uses to pull the image.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # NEXT_PUBLIC_SITE_URL and R2_PUBLIC_URL are repository variables, not
      # secrets. Next inlines them into client HTML during this build, so changing
      # either requires workflow_dispatch or a commit-triggered rebuild.
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            R2_PUBLIC_URL=${{ vars.R2_PUBLIC_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Dokploy creates the webhook after its first image exists in GHCR. Until
      # the secret is configured, publish the image without failing the job.
      - name: Notify Dokploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DOKPLOY_WEBHOOK_URL is not configured yet; skipping redeployment."
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK"
          echo "Redeployment webhook sent."
