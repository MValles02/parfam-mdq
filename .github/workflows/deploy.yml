# Production image build and Dokploy redeployment.
#
# The VPS has four shared vCPUs, so CI builds the image and the server only
# pulls the completed artifact.
#
# Checks run on PRs and pushes; image + deploy only on main.
name: Deploy

on:
  pull_request:
  push:
    branches: [main]
    # Documentation-only commits do not need an image rebuild or redeployment.
    paths-ignore:
      - "**.md"
  # Allows rebuilding without a commit, for example after a build argument change.
  workflow_dispatch:

permissions: {}

concurrency:
  # PRs: cancel superseded check runs. main: queue deployments so Dokploy never pulls a partially pushed `latest`.
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || 'deploy-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck, lint, and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Placeholder so prisma.config.ts's env("DATABASE_URL") does not throw
      # during postinstall `prisma generate`; no database is contacted.
      DATABASE_URL: "postgresql://build:build@127.0.0.1:5432/build?schema=public"

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

  image:
    name: Build and publish to GHCR
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/mvalles02/parfam-mdq
          tags: |
            type=raw,value=latest
            type=sha

      # NEXT_PUBLIC_SITE_URL and R2_PUBLIC_URL are repository variables, not
      # secrets. Next inlines them into client HTML during this build, so changing
      # either requires workflow_dispatch or a commit-triggered rebuild.
      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            R2_PUBLIC_URL=${{ vars.R2_PUBLIC_URL }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Notify Dokploy
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      # Dokploy creates the webhook after its first image exists in GHCR. Until
      # the secret is configured, publish the image without failing the job.
      - name: Notify Dokploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DOKPLOY_WEBHOOK_URL is not configured yet; skipping redeployment."
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK"
          echo "Redeployment webhook sent."

      - name: Verify deploy
        if: vars.HEALTH_URL != ''
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          for i in $(seq 30); do curl -fsS -m 10 "$HEALTH_URL" | jq -e --arg s "$GITHUB_SHA" '.status=="ok" and .sha==$s' && exit 0; sleep 10; done; exit 1
