# Cheap gitleaks scan of the commits each push adds, on every branch. PRs are
# also scanned by ci.yml, but a push reaches GitHub before any PR exists, and
# pushes to main/develop would go unscanned if the rulesets ever allowed a
# direct push. This lives apart from ci.yml so pushes never create skipped
# `checks`/`e2e` runs, which would satisfy those required checks.
name: Secrets scan

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The push payload lists the pushed commits (GitHub caps it at 2048), so
      # fetch only that many levels plus the previous tip instead of the whole
      # history.
      - name: Size the fetch
        id: push
        run: |
          COUNT=$(jq '.commits | length' "$GITHUB_EVENT_PATH")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "depth=$((COUNT + 1))" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ steps.push.outputs.depth }}
          persist-credentials: false

      - name: Secrets scan (gitleaks)
        env:
          BEFORE: ${{ github.event.before }}
          COUNT: ${{ steps.push.outputs.count }}
        run: |
          # A normal push scans before..sha. A new branch (before is all
          # zeros) or a force push (before is no longer an ancestor) falls back
          # to the pushed commits counted from the payload.
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git merge-base --is-ancestor "$BEFORE" "$GITHUB_SHA"; then
            RANGE="$BEFORE..$GITHUB_SHA"
          else
            RANGE="--max-count=$COUNT $GITHUB_SHA"
          fi
          if [ "$COUNT" = 0 ]; then
            echo "No new commits in this push."
            exit 0
          fi
          echo "Scanning: $RANGE"
          # Pinned by digest (not just tag) so a compromised/republished tag can't slip a different image into CI.
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --verbose --exit-code 1 --log-opts="$RANGE"
